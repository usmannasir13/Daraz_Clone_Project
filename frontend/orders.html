<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Orders | Daraz Clone</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="header"></div>
  <main class="container">
    <div id="flash"></div>
    <h2 class="section-title">My Orders</h2>
    <div id="content"></div>
  </main>
  <footer>Daraz Clone | Web Technology course project</footer>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      const me = await renderHeader();
      if (!requireLogin(me)) return;
      const { orders } = await api("/api/orders");
      $("content").innerHTML = orders.length ? `<div class="cart-items">${orders.map(o => `
        <div class="order-row">
          <a href="/order.html?id=${o.id}">Order #${o.id}</a>
          <span>${esc(localTime(o.created_at))}</span>
          <span class="line-total">${money(o.total)}</span>
          <span class="badge ${esc(o.status)}">${esc(o.status)}</span>
          <a class="link-btn" href="/order.html?id=${o.id}">View</a>
        </div>`).join("")}</div>`
        : '<p class="empty-box">You have not placed any orders yet. <a href="/">Start shopping</a></p>';
    })();
  </script>
</body>
</html>
