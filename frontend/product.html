<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product | Daraz Clone</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="header"></div>
  <main class="container">
    <div id="flash"></div>
    <div id="content"></div>
  </main>
  <footer>Daraz Clone | Web Technology course project</footer>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      await renderHeader();
      const id = new URLSearchParams(location.search).get("id");
      let p;
      try { p = await api("/api/products/" + encodeURIComponent(id)); }
      catch (e) { $("content").innerHTML = '<p class="empty-box">Product not found. <a href="/">Back to home</a></p>'; return; }

      document.title = p.name + " | Daraz Clone";
      $("content").innerHTML = `
        <nav class="crumbs"><a href="/">Home</a> &gt; <a href="/?category=${encodeURIComponent(p.category)}">${esc(p.category)}</a> &gt; <span>${esc(p.name)}</span></nav>
        <section class="detail">
          <img src="${esc(p.image)}" alt="${esc(p.name)}">
          <div class="detail-info">
            <h1>${esc(p.name)}</h1>
            <div class="detail-price">${money(p.price)}</div>
            ${p.old_price ? `<div class="old"><s>${money(p.old_price)}</s> <span class="off">-${discount(p)}%</span></div>` : ""}
            <p class="stock ${p.stock > 0 ? "in" : "out"}">${p.stock > 0 ? `In stock (${p.stock} available)` : "Out of stock"}</p>
            <p class="desc">${esc(p.description)}</p>
            <form id="add" class="add-form">
              <label for="quantity">Quantity</label>
              <input type="number" id="quantity" min="1" max="${p.stock}" value="1">
              <button type="submit" class="btn" ${p.stock > 0 ? "" : "disabled"}>Add to Cart</button>
            </form>
          </div>
        </section>`;

      $("add").onsubmit = async e => {
        e.preventDefault();
        try {
          await api("/api/cart/add", "POST", { product_id: p.id, quantity: parseInt($("quantity").value, 10) || 1 });
          await renderHeader();                      // refresh the Cart (n) count without reloading
          flash("Added to cart.", "success");
        } catch (err) {
          if (err.status === 401) { flashNext("Please log in first.", "error"); location.href = "/login.html"; }
          else flash(err.message);
        }
      };
    })();
  </script>
</body>
</html>
