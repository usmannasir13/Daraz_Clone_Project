<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up | Daraz Clone</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="header"></div>
  <main class="container">
    <div id="flash"></div>
    <section class="auth">
      <h1>Create your account</h1>
      <form id="form">
        <label for="name">Full name</label>
        <input type="text" id="name" required>
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <label for="password">Password (at least 6 characters)</label>
        <input type="password" id="password" minlength="6" required>
        <button class="btn" type="submit">Sign up</button>
      </form>
      <p class="auth-alt">Already have an account? <a href="/login.html">Log in</a></p>
    </section>
  </main>
  <footer>Daraz Clone | Web Technology course project</footer>
  <script src="/js/app.js"></script>
  <script>
    renderHeader();
    $("form").onsubmit = async e => {
      e.preventDefault();
      try {
        await api("/api/signup", "POST", { name: $("name").value, email: $("email").value, password: $("password").value });
        flashNext("Account created. Please log in.");
        location.href = "/login.html";
      } catch (err) { flash(err.message); }
    };
  </script>
</body>
</html>
