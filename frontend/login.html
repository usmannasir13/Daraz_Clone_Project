<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Daraz Clone</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="header"></div>
  <main class="container">
    <div id="flash"></div>
    <section class="auth">
      <h1>Log in</h1>
      <form id="form">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <label for="password">Password</label>
        <input type="password" id="password" required>
        <button class="btn" type="submit">Log in</button>
      </form>
      <p class="auth-alt">New to Daraz? <a href="/signup.html">Create an account</a></p>
    </section>
  </main>
  <footer>Daraz Clone | Web Technology course project</footer>
  <script src="/js/app.js"></script>
  <script>
    renderHeader();
    $("form").onsubmit = async e => {
      e.preventDefault();
      try {
        await api("/api/login", "POST", { email: $("email").value, password: $("password").value });
        location.href = "/";
      } catch (err) { flash(err.message); }
    };
  </script>
</body>
</html>
