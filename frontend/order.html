<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order | Daraz Clone</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="header"></div>
  <main class="container">
    <div id="flash"></div>
    <div id="content"></div>
  </main>
  <footer>Daraz Clone | Web Technology course project</footer>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      const me = await renderHeader();
      if (!requireLogin(me)) return;
      const id = new URLSearchParams(location.search).get("id");
      let data;
      try { data = await api("/api/orders/" + encodeURIComponent(id)); }
      catch (e) { $("content").innerHTML = '<p class="empty-box">Order not found. <a href="/orders.html">Back to My Orders</a></p>'; return; }

      const o = data.order;
      document.title = `Order #${o.id} | Daraz Clone`;
      $("content").innerHTML = `
        <h2 class="section-title">Order #${o.id} <span class="badge">${esc(o.status)}</span></h2>
        <section class="panel">
          <p class="note">Placed on ${esc(localTime(o.created_at))} | Cash on Delivery</p>
          <h3>Delivery address</h3>
          <p class="note">${esc(o.address)}</p>
          <h3>Items</h3>
          ${data.items.map(i => `
            <div class="od-row">
              <img src="${esc(i.image)}" alt="${esc(i.name)}">
              <span>${esc(i.name)}</span>
              <span>${i.quantity} x ${money(i.price)}</span>
              <span class="line-total">${money(i.price * i.quantity)}</span>
            </div>`).join("")}
          <div class="sum-row total"><span>Total</span><span>${money(o.total)}</span></div>
          <p class="auth-alt"><a href="/orders.html">Back to My Orders</a></p>
        </section>`;
    })();
  </script>
</body>
</html>
